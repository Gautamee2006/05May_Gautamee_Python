{% extends 'bookings/base.html' %}
{% load static %}

{% block title %}Login - CabGo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center py-4">
        <div class="col-md-6 col-lg-5">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-4 text-warning mb-2"><i class="fa-solid fa-taxi"></i></div>
                    <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to book rides and access your ride history</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-light fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-light fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-cabgo-primary w-100 py-3 fw-bold fs-5 mb-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                    </button>
                    
                    <div class="text-center">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="{% url 'register' %}" class="text-warning text-decoration-none fw-semibold ms-1">Register Now</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
