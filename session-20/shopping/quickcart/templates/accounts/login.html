{% extends 'base.html' %}

{% block title %}Login - QuickCart{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <h3 class="fw-bold mb-1"><i class="fa-solid fa-right-to-bracket text-warning me-2"></i> Welcome Back</h3>
                    <p class="text-muted mb-0 small">Login to your QuickCart account</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username or Email</label>
                            <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username or email" required>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label fw-semibold mb-0">Password</label>
                                <a href="{% url 'accounts:forgot_password' %}" class="small text-decoration-none text-primary">Forgot Password?</a>
                            </div>
                            <input type="password" name="password" class="form-control form-control-lg mt-1" placeholder="Enter password" required>
                        </div>

                        <div class="d-grid mt-4 mb-3">
                            <button type="submit" class="btn btn-warning btn-lg fw-bold rounded-pill text-dark shadow-sm">
                                Login Now <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-bold text-primary">Register Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
