{% extends 'base.html' %}

{% block title %}Forgot Password - QuickCart{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 text-center">
                <div class="mb-3">
                    <i class="fa-solid fa-lock-open display-4 text-warning mb-2"></i>
                    <h3 class="fw-bold">Forgot Password?</h3>
                    <p class="text-muted small">Enter your registered email address to receive an OTP code.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="Enter your email address" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold rounded-pill shadow-sm">Send Reset OTP</button>
                    </div>
                </form>

                <div class="mt-3">
                    <a href="{% url 'accounts:login' %}" class="small text-decoration-none text-secondary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
