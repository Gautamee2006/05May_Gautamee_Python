{% extends 'base.html' %}

{% block title %}Change Password - QuickCart{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <h4 class="fw-bold mb-3"><i class="fa-solid fa-key text-warning me-2"></i> Change Password</h4>
                
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            <input type="password" name="{{ field.name }}" class="form-control" required>
                            {% if field.help_text %}
                                <div class="form-text small">{{ field.help_text }}</div>
                            {% endif %}
                            {{ field.errors }}
                        </div>
                    {% endfor %}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-warning fw-bold text-dark rounded-pill shadow-sm">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
