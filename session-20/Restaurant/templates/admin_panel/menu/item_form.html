{% extends 'admin_panel/base_admin.html' %}
{% block content %}
<div class="max-w-xl">
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-amber-100 dark:border-slate-700 shadow-sm overflow-hidden">
        <div class="px-6 py-5 border-b border-amber-100 dark:border-slate-700">
            <h2 class="font-display font-bold text-lg text-slate-900 dark:text-white">Edit Food Item</h2>
        </div>
        <form method="post" action="{% url 'panel_food_item_edit' item.id %}" class="p-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Item Name *</label>
                <input type="text" name="name" value="{{ item.name }}" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-warm-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Category</label>
                <select name="category" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-warm-500">
                    {% for cat in categories %}<option value="{{ cat.id }}" {% if cat.id == item.category.id %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Price ($) *</label>
                <input type="number" name="price" value="{{ item.price }}" step="0.01" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-warm-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Description</label>
                <textarea name="description" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-warm-500">{{ item.description }}</textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Image URL</label>
                <input type="text" name="image" value="{{ item.image }}" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-warm-500">
            </div>
            <div class="flex items-center gap-6">
                <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 dark:text-slate-300">
                    <input type="checkbox" name="is_vegetarian" {% if item.is_vegetarian %}checked{% endif %} class="w-4 h-4 text-emerald-600"> Vegetarian
                </label>
                <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 dark:text-slate-300">
                    <input type="checkbox" name="is_available" {% if item.is_available %}checked{% endif %} class="w-4 h-4 text-warm-600"> Available
                </label>
            </div>
            <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                <button type="submit" class="px-8 py-3 rounded-xl bg-warm-600 hover:bg-warm-700 text-white font-bold text-sm shadow-md transition-colors">Update Item</button>
                <a href="{% url 'panel_menu_list' %}?restaurant={{ item.restaurant.id }}" class="px-6 py-3 rounded-xl border border-slate-200 dark:border-slate-600 text-sm font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
