<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<title>Luxury Header</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

/* Header */

header{
    width:100%;
    height:70px;
    background:#000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
    border-bottom:1px solid #2b2b2b;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

/* Logo */

.logo{
    font-size:28px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

.logo span{
    color:#d4af37;
}

/* Navigation */

nav{
    display:flex;
    align-items:center;
    gap:35px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    position:relative;
    transition:.3s;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:0;
    height:2px;
    background:#d4af37;
    transition:.3s;
}

nav a:hover{
    color:#d4af37;
}

nav a:hover::after{
    width:100%;
}

/* Dropdown */

.dropdown{
    position:relative;
}

.dropdown-content{
    position:absolute;
    top:40px;
    left:0;
    background:#111;
    min-width:180px;
    border-radius:10px;
    overflow:hidden;
    display:none;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
}

.dropdown-content a{
    display:block;
    padding:12px 18px;
    color:white;
}

.dropdown-content a:hover{
    background:#d4af37;
    color:black;
}


/* Right Side */

.icons{
    display:flex;
    align-items:center;
    gap:18px;
}

.icons a{
    text-decoration:none;
    color:white;
    font-size:18px;
    transition:.3s;
}

.icons a:hover{
    color:#d4af37;
    transform:scale(1.15);
}

/* Login Button */

.login-btn{
    background:#d4af37;
    color:black !important;
    padding:8px 20px;
    border-radius:25px;
    font-size:14px;
    font-weight:600;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.3s;
}

.login-btn:hover{
    background:white;
    color:black !important;
    transform:translateY(-2px);
}

/* Responsive */

@media(max-width:900px){

header{
    flex-direction:column;
    height:auto;
    padding:20px;
}

nav{
    flex-wrap:wrap;
    justify-content:center;
    margin:20px 0;
    gap:20px;
}

.icons{
    margin-bottom:15px;
}

}

</style>

</head>
<body>

<header>

<div class="logo">
<span>G</span>task
</div>

<nav>

<a href="/">Home</a>

<div class="dropdown">

<a href="#" onclick="toggleDropdown(event)">practise <i class="fa-solid fa-angle-down"></i>
</a>

<div class="dropdown-content" id="dropdownMenu">
<a href="/context">context</a>
<!-- <a href="#">Handicrafts</a>
<a href="#">Paintings</a>
<a href="#">Home Decor</a>
<a href="#">Gift Items</a> -->
</div>

</div>

<!-- <a href="#">Collections</a> -->

<a href="/about">About</a>

<a href="/contact">Contact</a>

</nav>

<div class="icons">

<!-- <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>

<a href="#"><i class="fa-regular fa-heart"></i></a>

<a href="#"><i class="fa-solid fa-cart-shopping"></i></a> -->

<!-- <a href="#" class="login-btn">
<i class="fa-solid fa-right-to-bracket"></i>&nbsp; Login
</a> -->

</div>

</header>
<script>
function toggleDropdown(event) {
    event.preventDefault();

    var menu = document.getElementById("dropdownMenu");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

// Bahar click karne par close
window.onclick = function(event) {
    if (!event.target.closest(".dropdown")) {
        document.getElementById("dropdownMenu").style.display = "none";
    }
}
</script>
</body>
</html>
