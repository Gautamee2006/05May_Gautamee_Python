<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container py-5">

    <h2 class="text-center text-warning mb-5">
        User Details
    </h2>

    <div class="row">

        {% for i in data %}

        <div class="col-md-6 col-lg-4 mb-4">

            <div class="card bg-black text-light border-secondary shadow-lg">

                <div class="card-body">

                    <h4 class="card-title text-warning">
                        {{ i.name }}
                    </h4>

                    <hr class="text-secondary">

                    <p><strong>Age :</strong> {{ i.age }}</p>

                    <p><strong>Email :</strong> {{ i.email }}</p>

                    <p><strong>Mobile :</strong> {{ i.mobile }}</p>

                    <p><strong>Address :</strong> {{ i.address }}</p>

                    <div class="d-grid gap-2 mt-4">

                        <a href="/updatedata/{{i.id}}/" class="btn btn-warning">
                            Update
                        </a>

                        <a href="/deletedata/{{i.id}}/" class="btn btn-danger">
                            Delete
                        </a>

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
