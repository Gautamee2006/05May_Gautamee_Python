<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-black d-flex justify-content-center align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card bg-dark text-white shadow-lg border-secondary">

                <div class="row g-0">

                    <!-- Left Side -->
                    <div class="col-md-6 bg-black d-flex flex-column justify-content-center p-5">

                        <h1 class="display-5 fw-bold">Welcome</h1>

                        <p class="text-secondary mt-3">
                            Enter your name to begin your journey.
                            Let's make today productive!
                        </p>

                    </div>

                    <!-- Right Side -->
                    <div class="col-md-6 p-5">

                        <h3 class="text-center mb-4">
                            Get Started
                        </h3>

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">
                                    Your Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control bg-secondary text-white border-0"
                                    placeholder="Enter your name"
                                    name="name">
                            </div>

                            <button class="btn btn-light w-100 fw-semibold">
                                Next →
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
