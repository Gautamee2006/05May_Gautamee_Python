<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> update Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card bg-black text-light shadow-lg border-secondary rounded-4 p-4" style="width:500px;">

        <h2 class="text-center mb-4 text-warning">
            Update Details  {{user.name}}
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" value="{{ user.name }}" class="form-control bg-dark text-light border-secondary">
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" value="{{user.age}}" class="form-control bg-dark text-light border-secondary" placeholder="Enter Age">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" value="{{user.email}}" class="form-control bg-dark text-light border-secondary" placeholder="Enter Email">
            </div>

            <div class="mb-3">
                <label class="form-label">Mobile No.</label>
                <input type="tel" name="mobile" value="{{user.mobile}}" class="form-control bg-dark text-light border-secondary" placeholder="Enter Mobile Number">
            </div>

            <div class="mb-4">
                <label class="form-label">Address</label>
                <input class="form-control bg-dark text-light border-secondary" name="address" value="{{user.address}}" placeholder="Enter Address">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-warning btn-lg">
                    update 
                </button>
                
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
