<!DOCTYPE html>
<html>

<head>

    <title>Verify OTP</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }


        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }


        h2 {
            text-align: center;
        }


        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }


        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }


        .message {
            padding: 10px;
            margin-bottom: 15px;
            background: #ffe6e6;
        }

    </style>

</head>


<body>


<div class="container">


    <h2>Verify OTP</h2>


    <p>
        Enter the 6-digit OTP sent to your email.
    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="message">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        {{ form.as_p }}


        <button type="submit">

            Verify OTP

        </button>

    </form>


</div>


</body>

</html>
