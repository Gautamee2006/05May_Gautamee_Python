<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

    </style>

</head>


<body>


<div class="container">

    <h2>Forgot Password</h2>


    <p>
        Enter your email address to receive a
        6-digit OTP.
    </p>


    <form method="POST">

        {% csrf_token %}


        {{ form.as_p }}


        <button type="submit">

            Send OTP

        </button>

    </form>


</div>


</body>

</html>
