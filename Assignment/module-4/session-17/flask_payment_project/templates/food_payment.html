{% extends "base.html" %}

{% block title %}Food Order Payment — Stripe Test{% endblock %}

{% block content %}
<div class="card" style="max-width: 540px; margin: 0 auto;">
    <h1 class="card-title">Zomato Food Order</h1>
    <p class="card-subtitle">Stripe Checkout Test Mode</p>

    <form action="{{ url_for('food_payment') }}" method="POST" id="stripe-food-form">
        <div class="form-group">
            <label for="dish_name" class="form-label">Dish Name</label>
            <input 
                type="text" 
                id="dish_name" 
                name="dish_name" 
                class="form-control" 
                placeholder="e.g. Paneer Butter Masala" 
                value="{{ form_data.dish_name if form_data else '' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="price" class="form-label">Price (USD)</label>
            <input 
                type="number" 
                step="0.01" 
                min="0.5" 
                id="price" 
                name="price" 
                class="form-control" 
                placeholder="e.g. 14.99" 
                value="{{ form_data.price if form_data else '' }}"
                required
            >
        </div>

        <button type="submit" class="btn btn-stripe" id="stripe-submit-btn">
            Pay with Stripe Checkout →
        </button>
    </form>
</div>
{% endblock %}
