{% extends 'integration_app/base.html' %}

{% block title %}Success — Integration App{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 2rem auto; text-align: center;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(16, 185, 129, 0.2); border: 2px solid #34d399; color: #34d399; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem auto; animation: pulse 2s infinite;">
        ✓
    </div>
    <h2 style="font-size: 2rem; font-weight: 700; color: #34d399; margin-bottom: 0.75rem;">
        Operation Successful!
    </h2>
    <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem;">
        {{ message|default:"Your request was completed successfully." }}
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{% url 'profile' %}" class="btn btn-primary" style="flex: 1;">
            👤 View Profile
        </a>
        <a href="{% url 'home' %}" class="btn btn-secondary" style="flex: 1;">
            🏠 Home
        </a>
    </div>
</div>

<style>
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
    70% { box-shadow: 0 0 0 15px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
}
</style>
{% endblock %}
