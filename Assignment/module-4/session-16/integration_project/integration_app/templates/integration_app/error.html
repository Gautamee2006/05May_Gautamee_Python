{% extends 'integration_app/base.html' %}

{% block title %}Error — Integration App{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 2rem auto; text-align: center;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(239, 68, 68, 0.2); border: 2px solid #f87171; color: #f87171; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem auto;">
        ✕
    </div>
    <h2 style="font-size: 2rem; font-weight: 700; color: #f87171; margin-bottom: 0.75rem;">
        An Error Occurred
    </h2>
    <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem;">
        {{ error_message|default:"An unexpected error occurred while processing your request. Please try again." }}
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="javascript:history.back()" class="btn btn-primary" style="flex: 1; background: linear-gradient(135deg, #ef4444, #dc2626);">
            ↩ Go Back
        </a>
        <a href="{% url 'home' %}" class="btn btn-secondary" style="flex: 1;">
            🏠 Home Page
        </a>
    </div>
</div>
{% endblock %}
