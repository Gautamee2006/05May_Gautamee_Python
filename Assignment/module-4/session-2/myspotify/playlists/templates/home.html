<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:50px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    width:500px;
}

h1{
    font-size:40px;
    color:#FFD700;
    margin-bottom:20px;
}

p{
    font-size:18px;
    color:#ddd;
    margin-bottom:35px;
    line-height:1.6;
}

a{
    text-decoration:none;
    background:#1DB954;
    color:white;
    padding:15px 35px;
    font-size:20px;
    border-radius:30px;
    transition:.3s;
    font-weight:bold;
}

a:hover{
    background:#169944;
    transform:scale(1.05);
}

.footer{
    margin-top:35px;
    color:#bbb;
    font-size:15px;
}
</style>

</head>
<body>

<div class="container">

<h1>🎵 Welcome {{name}} to My Spotify Playlists 🎵</h1>

<p>
Enjoy your favorite devotional songs anytime.<br>
Explore the beautiful <b>Krishna Devotional Playlist</b> and experience peaceful music.
</p>

<a href="/music">🎶 Open Music Playlist</a>

<div class="footer">
Made with ❤️ using Django
</div>

</div>

</body>
</html>
