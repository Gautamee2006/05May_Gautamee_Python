<!DOCTYPE html>

<html>

<head>

    <title>My Profile</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }


        .profile-container {

            width: 450px;

            margin: 60px auto;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 0 15px #ccc;

            text-align: center;
        }


        .profile-image {

            width: 150px;

            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #ddd;
        }


        .display-name {

            font-size: 25px;

            font-weight: bold;

            margin-top: 20px;
        }


        .bio {

            color: #666;

            margin: 15px;

            line-height: 1.5;
        }


        .phone {

            color: #555;

            margin: 15px;
        }


        .edit-btn {

            display: inline-block;

            padding: 10px 20px;

            background: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            margin-top: 15px;
        }


        .edit-btn:hover {

            background: #0056b3;
        }

    </style>

</head>


<body>


<div class="profile-container">


    <!-- Profile Picture -->

    {% if profile.profile_pic %}

        <img
            src="{{ profile.profile_pic.url }}"
            class="profile-image"
            alt="Profile Picture"
        >

    {% else %}

        <img
            src="/static/images/default_profile.png"
            class="profile-image"
            alt="Default Profile"
        >

    {% endif %}


    <!-- Display Name -->

    <div class="display-name">

        {{ profile.display_name }}

    </div>


    <!-- Bio -->

    <div class="bio">

        {% if profile.bio %}

            {{ profile.bio }}

        {% else %}

            No bio added yet.

        {% endif %}

    </div>


    <!-- Phone -->

    <div class="phone">

        {% if profile.phone_number %}

            📱 {{ profile.phone_number }}

        {% else %}

            📱 No phone number added.

        {% endif %}

    </div>


    <!-- Edit Button -->

    <a
        href="{% url 'edit_profile' %}"
        class="edit-btn"
    >

        Edit Profile

    </a>


</div>


</body>

</html>
