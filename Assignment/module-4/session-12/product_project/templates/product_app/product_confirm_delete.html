<!DOCTYPE html>

<html>

<head>

    <title>Delete Product</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f1f3f6;

            margin: 0;
        }


        .container {

            width: 450px;

            margin: 100px auto;

            background: white;

            padding: 35px;

            text-align: center;

            border-radius: 10px;

            box-shadow: 0 0 10px #ddd;
        }


        h2 {

            color: #dc3545;

            margin-bottom: 20px;
        }


        .product-name {

            font-size: 20px;

            font-weight: bold;

            margin: 15px 0;
        }


        .delete-btn {

            display: inline-block;

            padding: 10px 20px;

            background: #dc3545;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }


        .cancel-btn {

            display: inline-block;

            padding: 10px 20px;

            background: #6c757d;

            color: white;

            text-decoration: none;

            border-radius: 5px;

            margin-left: 10px;
        }


        .delete-btn:hover {

            background: #b52a37;
        }


        .cancel-btn:hover {

            background: #545b62;
        }

    </style>

</head>


<body>


<div class="container">


    <h2>
        ⚠️ Delete Product?
    </h2>


    <p>
        Are you sure you want to delete this product?
    </p>


    <div class="product-name">

        "{{ product.name }}"

    </div>


    <form method="POST">

        {% csrf_token %}


        <button
            type="submit"
            class="delete-btn"
        >

            Yes, delete

        </button>


        <a
            href="{% url 'product_list' %}"
            class="cancel-btn"
        >

            Cancel

        </a>


    </form>


</div>


</body>

</html>
